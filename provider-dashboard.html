<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>QuickServe — Provider Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/provider.css">
</head>

<body class="app-body">
    <div id="toastHost" class="toast-host"></div>
    <div class="mobile-top"><a href="index.html" class="navbar-brand fw-800"><span
                class="brand-dot"></span>QuickServe</a><button id="menuBtn" class="btn btn-light">☰</button></div>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"><a href="index.html" class="side-brand"><span
                    class="brand-dot"></span>QuickServe</a>
            <nav><a class="active" href="#overview">▦ <span>Dashboard</span></a><a href="#incoming">🎫 <span>Incoming
                        Requests</span></a><a href="#active">⚡ <span>Active Jobs</span></a><a href="#completed">✓
                    <span>Completed Jobs</span></a><a href="#reviews">★ <span>Reviews</span></a></nav><button
                id="logoutBtn" class="logout">↪ <span>Logout</span></button>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <div><span class="muted">Provider Portal</span>
                    <h1 id="greeting">Your service desk 👋</h1>
                </div>
                <div class="user-pill"><span id="avatar">P</span><span id="userName">Provider</span></div>
            </header>
            <section id="overview">
                <div class="stat-grid">
                    <div class="dash-stat"><span>New Requests</span><strong id="newCount">0</strong></div>
                    <div class="dash-stat"><span>Accepted</span><strong id="acceptedCount">0</strong></div>
                    <div class="dash-stat"><span>In Progress</span><strong id="progressCount">0</strong></div>
                    <div class="dash-stat"><span>Completed</span><strong id="completedCount">0</strong></div>
                </div>
            </section>
            <section id="incoming" class="dash-section">
                <div class="section-title">
                    <div><span class="eyebrow">CUSTOMER REQUESTS</span>
                        <h2>Incoming Requests</h2>
                    </div><button id="refreshBtn" class="btn btn-light border rounded-3">↻ Refresh</button>
                </div>
                <div id="bookingList" class="provider-bookings">
                    <div class="loading">Loading requests…</div>
                </div>
            </section>
            <section id="reviews" class="dash-section">
                <div class="section-title">
                    <div><span class="eyebrow">FEEDBACK</span>
                        <h2>Customer Reviews</h2>
                    </div>
                </div>
                <div id="providerReviews" class="review-grid"></div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script type="module" src="js/provider-dashboard.js"></script>
</body>

</html>
